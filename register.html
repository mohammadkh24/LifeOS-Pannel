<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ساخت حساب | LifeOS</title>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <a href="./index.html" class="auth-logo">
                Life<span>OS</span>
            </a>

            <div class="auth-header">

                <h1>
                    ساخت حساب جدید
                </h1>

                <p>
                    برای شروع، اطلاعاتت رو وارد کن.
                </p>

            </div>


            <form id="registerForm" class="auth-form">

                <div class="form-group">

                    <label for="name">
                        نام
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="نام خودت رو وارد کن"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        ایمیل
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        رمز عبور
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="حداقل ۶ کاراکتر"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div id="registerError" class="form-error"></div>


                <button
                    type="submit"
                    id="registerButton"
                    class="primary-btn auth-submit"
                >
                    ساخت حساب
                </button>

            </form>


            <div class="auth-footer">

                <span>
                    قبلاً حساب داری؟
                </span>

                <a href="./login.html">
                    ورود
                </a>

            </div>

        </div>

    </main>


    <script src="./js/api.js"></script>
    <script src="./js/register.js"></script>
</body>

</html>
